<div class="cui-stack" data-gap="5" style="max-width: 360px; margin-inline: auto">
  <div class="cui-progress" data-cui="progress" role="progressbar" aria-labelledby="queued-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
    <span class="cui-progress-label" data-cui="progress-label" id="queued-label">Queued frames</span>
    <div class="cui-progress-value-label" data-cui="progress-value-label">0%</div>
    <div class="cui-progress-track" data-cui="progress-track">
      <div class="cui-progress-fill" data-cui="progress-fill" style="--cui-progress-fill-width: 0%"></div>
    </div>
  </div>
  <div class="cui-progress" data-cui="progress" role="progressbar" aria-labelledby="frames-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" aria-valuetext="60%">
    <span class="cui-progress-label" data-cui="progress-label" id="frames-label">Export frames</span>
    <div class="cui-progress-value-label" data-cui="progress-value-label">60%</div>
    <div class="cui-progress-track" data-cui="progress-track">
      <div class="cui-progress-fill" data-cui="progress-fill" style="--cui-progress-fill-width: 60%"></div>
    </div>
  </div>
  <div class="cui-progress" data-cui="progress" role="progressbar" aria-labelledby="done-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="100%">
    <span class="cui-progress-label" data-cui="progress-label" id="done-label">Export complete</span>
    <div class="cui-progress-value-label" data-cui="progress-value-label">100%</div>
    <div class="cui-progress-track" data-cui="progress-track">
      <div class="cui-progress-fill" data-cui="progress-fill" style="--cui-progress-fill-width: 100%"></div>
    </div>
  </div>
</div>
