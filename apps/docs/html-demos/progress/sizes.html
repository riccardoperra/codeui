<div class="cui-stack" data-gap="5" style="max-width: 360px; margin-inline: auto">
  <div class="cui-progress" data-cui="progress" data-size="sm" role="progressbar" aria-labelledby="png-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-valuetext="40%">
    <span class="cui-progress-label" data-cui="progress-label" id="png-label">PNG export</span>
    <div class="cui-progress-value-label" data-cui="progress-value-label">40%</div>
    <div class="cui-progress-track" data-cui="progress-track" data-size="sm">
      <div class="cui-progress-fill" data-cui="progress-fill" style="--cui-progress-fill-width: 40%"></div>
    </div>
  </div>
  <div class="cui-progress" data-cui="progress" data-size="md" role="progressbar" aria-labelledby="video-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" aria-valuetext="60%">
    <span class="cui-progress-label" data-cui="progress-label" id="video-label">Video export</span>
    <div class="cui-progress-value-label" data-cui="progress-value-label">60%</div>
    <div class="cui-progress-track" data-cui="progress-track" data-size="md">
      <div class="cui-progress-fill" data-cui="progress-fill" style="--cui-progress-fill-width: 60%"></div>
    </div>
  </div>
</div>
