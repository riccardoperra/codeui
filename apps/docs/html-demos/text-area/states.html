<div class="cui-stack" data-gap="4" style="max-width: 360px; margin-inline: auto">
  <div class="cui-textarea cui-field" data-cui="textfield" data-field-size="sm" role="group">
    <label for="state-required" class="cui-field-label" data-cui="textfield-label">Caption (required)</label>
    <textarea id="state-required" placeholder="Add a caption" required aria-required="true" class="cui-field-input cui-textarea-input" data-cui="textfield-input" data-size="sm" data-variant="filled"></textarea>
  </div>
  <div class="cui-textarea cui-field" data-cui="textfield" data-field-size="sm" role="group">
    <label for="state-readonly" class="cui-field-label" data-cui="textfield-label">Generated alt text</label>
    <textarea id="state-readonly" readonly class="cui-field-input cui-textarea-input" data-cui="textfield-input" data-size="sm" data-variant="filled">A TypeScript snippet that logs a greeting.</textarea>
  </div>
  <div class="cui-textarea cui-field" data-cui="textfield" data-field-size="sm" role="group">
    <label for="state-disabled" class="cui-field-label" data-cui="textfield-label">Notes</label>
    <textarea id="state-disabled" disabled data-disabled class="cui-field-input cui-textarea-input" data-cui="textfield-input" data-size="sm" data-variant="filled">Locked by the workspace owner.</textarea>
  </div>
</div>
