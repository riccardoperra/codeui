<div class="cui-stack" data-direction="row" data-gap="3" data-wrap="true">
  <div data-cui-theme="light" class="cui-stack" data-gap="3" style="flex: 1; min-width: 220px; padding: 20px; border-radius: 12px; background: var(--cui-surface-panel); color: var(--cui-text-default)">
    <span class="cui-text" data-weight="medium">Light scope</span>
    <div class="cui-stack" data-direction="row" data-gap="2">
      <button type="button" class="cui-button" data-cui="button" data-variant="primary">Export</button>
      <button type="button" class="cui-button" data-cui="button" data-variant="secondary">Copy</button>
    </div>
  </div>
  <div data-cui-theme="dark" class="cui-stack" data-gap="3" style="flex: 1; min-width: 220px; padding: 20px; border-radius: 12px; background: var(--cui-surface-panel); color: var(--cui-text-default)">
    <span class="cui-text" data-weight="medium">Dark scope</span>
    <div class="cui-stack" data-direction="row" data-gap="2">
      <button type="button" class="cui-button" data-cui="button" data-variant="primary">Export</button>
      <button type="button" class="cui-button" data-cui="button" data-variant="secondary">Copy</button>
    </div>
  </div>
</div>
