<div class="cui-accordion" data-cui="accordion" role="group" aria-label="Snippet settings" style="max-width: 420px; margin-inline: auto">
  <div class="cui-accordion-item" data-cui="accordion-item" data-closed>
    <h3 class="cui-accordion-header" data-cui="accordion-header" data-closed>
      <button type="button" class="cui-accordion-trigger" data-cui="accordion-trigger" data-density="compact" id="compact-trigger" aria-controls="compact-content" aria-expanded="false" data-closed>
        <span class="cui-accordion-title" data-cui="accordion-title">Compact</span>
        <span class="cui-accordion-summary" data-cui="accordion-summary">64 px</span>
        <span class="cui-accordion-chevron" data-cui="accordion-chevron" aria-hidden="true">›</span>
      </button>
    </h3>
    <div class="cui-accordion-content" data-cui="accordion-content" id="compact-content" role="region" aria-labelledby="compact-trigger" data-closed hidden>
      <div class="cui-accordion-content-body">
        Padding around the snippet.
      </div>
    </div>
  </div>
  <div class="cui-accordion-item" data-cui="accordion-item" data-closed>
    <h3 class="cui-accordion-header" data-cui="accordion-header" data-closed>
      <button type="button" class="cui-accordion-trigger" data-cui="accordion-trigger" data-density="default" id="default-trigger" aria-controls="default-content" aria-expanded="false" data-closed>
        <span class="cui-accordion-title" data-cui="accordion-title">Default</span>
        <span class="cui-accordion-summary" data-cui="accordion-summary">macOS</span>
        <span class="cui-accordion-chevron" data-cui="accordion-chevron" aria-hidden="true">›</span>
      </button>
    </h3>
    <div class="cui-accordion-content" data-cui="accordion-content" id="default-content" role="region" aria-labelledby="default-trigger" data-closed hidden>
      <div class="cui-accordion-content-body">
        Window controls and title bar.
      </div>
    </div>
  </div>
  <div class="cui-accordion-item" data-cui="accordion-item" data-closed>
    <h3 class="cui-accordion-header" data-cui="accordion-header" data-closed>
      <button type="button" class="cui-accordion-trigger" data-cui="accordion-trigger" data-density="comfortable" id="comfortable-trigger" aria-controls="comfortable-content" aria-expanded="false" data-closed>
        <span class="cui-accordion-title" data-cui="accordion-title">Comfortable</span>
        <span class="cui-accordion-summary" data-cui="accordion-summary">Inter</span>
        <span class="cui-accordion-chevron" data-cui="accordion-chevron" aria-hidden="true">›</span>
      </button>
    </h3>
    <div class="cui-accordion-content" data-cui="accordion-content" id="comfortable-content" role="region" aria-labelledby="comfortable-trigger" data-closed hidden>
      <div class="cui-accordion-content-body">
        Font used for the title bar.
      </div>
    </div>
  </div>
</div>
