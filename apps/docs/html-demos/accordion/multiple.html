<div class="cui-accordion" data-cui="accordion" role="group" aria-label="Snippet settings" style="max-width: 420px; margin-inline: auto">
  <div class="cui-accordion-item" data-cui="accordion-item" data-expanded>
    <h3 class="cui-accordion-header" data-cui="accordion-header" data-expanded>
      <button type="button" class="cui-accordion-trigger" data-cui="accordion-trigger" data-density="default" id="frame-trigger" aria-controls="frame-content" aria-expanded="true" data-expanded>
        <span class="cui-accordion-title" data-cui="accordion-title">Frame</span>
        <span class="cui-accordion-summary" data-cui="accordion-summary">64 px</span>
        <span class="cui-accordion-chevron" data-cui="accordion-chevron" aria-hidden="true">›</span>
      </button>
    </h3>
    <div class="cui-accordion-content" data-cui="accordion-content" id="frame-content" role="region" aria-labelledby="frame-trigger" data-expanded data-open>
      <div class="cui-accordion-content-body">
        Padding around the snippet.
      </div>
    </div>
  </div>
  <div class="cui-accordion-item" data-cui="accordion-item" data-expanded>
    <h3 class="cui-accordion-header" data-cui="accordion-header" data-expanded>
      <button type="button" class="cui-accordion-trigger" data-cui="accordion-trigger" data-density="default" id="window-trigger" aria-controls="window-content" aria-expanded="true" data-expanded>
        <span class="cui-accordion-title" data-cui="accordion-title">Window</span>
        <span class="cui-accordion-summary" data-cui="accordion-summary">macOS</span>
        <span class="cui-accordion-chevron" data-cui="accordion-chevron" aria-hidden="true">›</span>
      </button>
    </h3>
    <div class="cui-accordion-content" data-cui="accordion-content" id="window-content" role="region" aria-labelledby="window-trigger" data-expanded data-open>
      <div class="cui-accordion-content-body">
        Window controls and title bar.
      </div>
    </div>
  </div>
  <div class="cui-accordion-item" data-cui="accordion-item" data-closed>
    <h3 class="cui-accordion-header" data-cui="accordion-header" data-closed>
      <button type="button" class="cui-accordion-trigger" data-cui="accordion-trigger" data-density="default" id="export-trigger" aria-controls="export-content" aria-expanded="false" data-closed>
        <span class="cui-accordion-title" data-cui="accordion-title">Export</span>
        <span class="cui-accordion-summary" data-cui="accordion-summary">PNG</span>
        <span class="cui-accordion-chevron" data-cui="accordion-chevron" aria-hidden="true">›</span>
      </button>
    </h3>
    <div class="cui-accordion-content" data-cui="accordion-content" id="export-content" role="region" aria-labelledby="export-trigger" data-closed hidden>
      <div class="cui-accordion-content-body">
        Format and scale of the exported image.
      </div>
    </div>
  </div>
</div>
