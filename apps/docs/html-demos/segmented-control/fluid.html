<div class="cui-stack" data-gap="4" data-align="stretch" style="max-width: 420px; margin-inline: auto">
  <div class="cui-segmentedcontrol" data-cui="segmentedcontrol" data-size="sm" data-variant="solid" data-fluid>
    <div role="tablist" aria-label="Editor theme (fluid)" aria-orientation="horizontal" class="cui-segmentedcontrol-list" data-cui="segmentedcontrol-list">
      <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Light</button>
      <button type="button" role="tab" aria-selected="true" tabindex="0" data-selected class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Dark</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">System</button>
      <div role="presentation" class="cui-segmentedcontrol-indicator" data-cui="segmentedcontrol-indicator" style="left: calc((100% + var(--cui-space-1)) / 3); width: calc((100% - 2 * var(--cui-space-1)) / 3)"></div>
    </div>
  </div>
  <div class="cui-segmentedcontrol" data-cui="segmentedcontrol" data-size="sm" data-variant="solid" data-fluid data-autowidth>
    <div role="tablist" aria-label="Editor theme (fluid, auto width)" aria-orientation="horizontal" class="cui-segmentedcontrol-list" data-cui="segmentedcontrol-list">
      <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Light</button>
      <button type="button" role="tab" aria-selected="true" tabindex="0" data-selected class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Dark</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">System</button>
      <div role="presentation" class="cui-segmentedcontrol-indicator" data-cui="segmentedcontrol-indicator" style="left: calc((100% + var(--cui-space-1)) / 3); width: calc((100% - 2 * var(--cui-space-1)) / 3)"></div>
    </div>
  </div>
</div>
