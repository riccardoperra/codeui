<div class="cui-stack" data-gap="4" data-align="start">
  <div class="cui-segmentedcontrol" data-cui="segmentedcontrol" data-size="sm" data-variant="solid">
    <div role="tablist" aria-label="Editor theme" aria-orientation="horizontal" class="cui-segmentedcontrol-list" data-cui="segmentedcontrol-list">
      <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Light</button>
      <button type="button" role="tab" aria-selected="true" tabindex="0" data-selected class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Dark</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" disabled data-disabled class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">System</button>
      <div role="presentation" class="cui-segmentedcontrol-indicator" data-cui="segmentedcontrol-indicator" style="width: 54px; transform: translateX(58px)"></div>
    </div>
  </div>
  <div class="cui-segmentedcontrol" data-cui="segmentedcontrol" data-size="sm" data-variant="solid" data-disabled>
    <div role="tablist" aria-label="Editor theme (disabled)" aria-orientation="horizontal" class="cui-segmentedcontrol-list" data-cui="segmentedcontrol-list">
      <button type="button" role="tab" aria-selected="false" tabindex="-1" disabled data-disabled class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Light</button>
      <button type="button" role="tab" aria-selected="true" tabindex="0" disabled data-disabled data-selected class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Dark</button>
      <button type="button" role="tab" aria-selected="false" tabindex="-1" disabled data-disabled class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">System</button>
      <div role="presentation" class="cui-segmentedcontrol-indicator" data-cui="segmentedcontrol-indicator" style="width: 54px; transform: translateX(58px)"></div>
    </div>
  </div>
</div>
