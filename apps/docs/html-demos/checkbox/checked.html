<div class="cui-stack" data-gap="4">
  <div class="cui-checkbox cui-field" data-cui="checkbox" data-field-size="md">
    <input id="state-off" type="checkbox" class="cui-checkbox-input" />
    <div class="cui-checkbox-control" data-cui="checkbox-control" data-size="md" aria-hidden="true">
      <div class="cui-checkbox-indicator">
        <svg class="cui-icon cui-checkbox-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>
    </div>
    <div class="cui-checkbox-content">
      <label for="state-off" class="cui-checkbox-label">Show window header</label>
    </div>
  </div>
  <div class="cui-checkbox cui-field" data-cui="checkbox" data-field-size="md" data-checked>
    <input id="state-on" type="checkbox" checked class="cui-checkbox-input" />
    <div class="cui-checkbox-control" data-cui="checkbox-control" data-size="md" aria-hidden="true">
      <div class="cui-checkbox-indicator">
        <svg class="cui-icon cui-checkbox-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>
    </div>
    <div class="cui-checkbox-content">
      <label for="state-on" class="cui-checkbox-label">Show line numbers</label>
    </div>
  </div>
</div>
