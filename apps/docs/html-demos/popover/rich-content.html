<div class="cui-stack" data-gap="1.5" data-align="start">
  <button type="button" aria-haspopup="dialog" aria-expanded="true" aria-controls="styles-popover" class="cui-button" data-cui="popover-trigger" data-variant="secondary" data-expanded>Export styles</button>
  <div id="styles-popover" role="dialog" aria-labelledby="styles-title" aria-describedby="styles-description" tabindex="-1" class="cui-popover-content" data-cui="popover-content" data-variant="default" data-expanded>
    <h2 id="styles-title" class="cui-popover-title" data-cui="popover-title" style="margin: 0">
      <span class="cui-stack" data-direction="row" data-gap="2" data-align="center">
        Export styles
        <span class="cui-badge" data-cui="badge" data-tone="info" data-variant="soft" data-size="sm">
          <span class="cui-badge-label" data-cui="badge-label">New</span>
        </span>
      </span>
    </h2>
    <p id="styles-description" class="cui-popover-description" data-cui="popover-description" style="margin: 0">Applies to every new export.</p>
    <div class="cui-stack" data-direction="row" data-gap="2">
      <button type="button" class="cui-button" data-cui="button" data-variant="secondary" data-block>PNG</button>
      <button type="button" class="cui-button" data-cui="button" data-variant="secondary" data-block>SVG</button>
    </div>
  </div>
</div>
