<div class="cui-stack" data-direction="row" data-gap="6" data-justify="center" data-wrap="true">
  <div class="cui-stack" data-gap="1" data-align="center">
    <span class="cui-tooltip-trigger" data-cui="tooltip-trigger" data-expanded>
      <button type="button" aria-describedby="primary-tip" class="cui-button" data-cui="button" data-variant="secondary">primary</button>
    </span>
    <div id="primary-tip" role="tooltip" class="cui-tooltip-content" data-cui="tooltip-content" data-variant="primary" data-expanded>Primary tooltip</div>
  </div>
  <div class="cui-stack" data-gap="1" data-align="center">
    <span class="cui-tooltip-trigger" data-cui="tooltip-trigger" data-expanded>
      <button type="button" aria-describedby="secondary-tip" class="cui-button" data-cui="button" data-variant="secondary">secondary</button>
    </span>
    <div id="secondary-tip" role="tooltip" class="cui-tooltip-content" data-cui="tooltip-content" data-variant="secondary" data-expanded>Secondary tooltip</div>
  </div>
</div>
