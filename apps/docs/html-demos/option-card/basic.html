<div style="max-width: 688px; margin-inline: auto">
  <div role="radiogroup" aria-labelledby="mode-label" aria-orientation="horizontal" class="cui-optioncard" data-cui="optioncard">
    <span id="mode-label" class="cui-optioncard-label" data-cui="optioncard-label">Colour mode</span>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-checked>
      <input id="mode-dark" type="radio" name="mode" value="dark" checked aria-describedby="mode-dark-desc" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="mode-dark" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-checked>
        <span class="cui-optioncard-preview" data-cui="optioncard-preview" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="22" r="18" fill="#2c2f4a" />
            <circle cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-opacity="0.18" />
          </svg>
        </span>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Dark</span>
            <span class="cui-badge cui-optioncard-badge" data-cui="optioncard-badge" data-size="sm" data-tone="neutral" data-variant="soft">
              <span class="cui-badge-label" data-cui="badge-label">Default</span>
            </span>
          </span>
          <span id="mode-dark-desc" class="cui-optioncard-item-description" data-cui="optioncard-item-description">A darker workspace</span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="mode-light" type="radio" name="mode" value="light" aria-describedby="mode-light-desc" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="mode-light" class="cui-optioncard-item-label" data-cui="optioncard-item-label">
        <span class="cui-optioncard-preview" data-cui="optioncard-preview" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="22" r="18" fill="#f5f5f7" />
            <circle cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-opacity="0.18" />
          </svg>
        </span>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Light</span>
          </span>
          <span id="mode-light-desc" class="cui-optioncard-item-description" data-cui="optioncard-item-description">A brighter workspace</span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="mode-system" type="radio" name="mode" value="system" aria-describedby="mode-system-desc" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="mode-system" class="cui-optioncard-item-label" data-cui="optioncard-item-label">
        <span class="cui-optioncard-preview" data-cui="optioncard-preview" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="22" r="18" fill="#f5f5f7" />
            <path d="M22 4a18 18 0 0 1 0 36z" fill="#2c2f4a" />
            <circle cx="22" cy="22" r="18" fill="none" stroke="currentColor" stroke-opacity="0.18" />
          </svg>
        </span>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>System</span>
          </span>
          <span id="mode-system-desc" class="cui-optioncard-item-description" data-cui="optioncard-item-description">Follow your device</span>
        </span>
      </label>
    </div>
  </div>
</div>
