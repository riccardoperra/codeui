<div style="max-width: 688px; margin-inline: auto">
  <div role="radiogroup" aria-labelledby="appearance-label" aria-orientation="vertical" class="cui-optioncard" data-cui="optioncard" data-orientation="vertical">
    <span id="appearance-label" class="cui-optioncard-label" data-cui="optioncard-label">Export appearance</span>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-checked>
      <input id="appearance-window" type="radio" name="appearance" value="window" checked aria-describedby="appearance-window-desc" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="appearance-window" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-checked>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Window</span>
          </span>
          <span id="appearance-window-desc" class="cui-optioncard-item-description" data-cui="optioncard-item-description">Include window controls</span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="appearance-plain" type="radio" name="appearance" value="plain" aria-describedby="appearance-plain-desc" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="appearance-plain" class="cui-optioncard-item-label" data-cui="optioncard-item-label">
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Plain</span>
          </span>
          <span id="appearance-plain-desc" class="cui-optioncard-item-description" data-cui="optioncard-item-description">Show the code alone</span>
        </span>
      </label>
    </div>
  </div>
</div>
