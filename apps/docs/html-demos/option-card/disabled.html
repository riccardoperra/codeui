<div class="cui-stack" data-gap="6" style="max-width: 688px; margin-inline: auto">
  <div role="radiogroup" aria-labelledby="unavailable-label" aria-orientation="horizontal" class="cui-optioncard" data-cui="optioncard">
    <span id="unavailable-label" class="cui-optioncard-label" data-cui="optioncard-label">Unavailable option</span>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-checked>
      <input id="unavailable-dark" type="radio" name="unavailable" value="dark" checked class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="unavailable-dark" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-checked>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Dark</span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="unavailable-light" type="radio" name="unavailable" value="light" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="unavailable-light" class="cui-optioncard-item-label" data-cui="optioncard-item-label">
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Light</span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="unavailable-system" type="radio" name="unavailable" value="system" disabled class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="unavailable-system" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-disabled>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>System</span>
          </span>
        </span>
      </label>
    </div>
  </div>
  <div role="radiogroup" aria-labelledby="locked-label" aria-orientation="horizontal" class="cui-optioncard" data-cui="optioncard">
    <span id="locked-label" class="cui-optioncard-label" data-cui="optioncard-label">Locked appearance</span>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-checked>
      <input id="locked-dark" type="radio" name="locked" value="dark" checked disabled class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="locked-dark" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-checked data-disabled>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Dark</span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="locked-light" type="radio" name="locked" value="light" disabled class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="locked-light" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-disabled>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Light</span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="locked-system" type="radio" name="locked" value="system" disabled class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="locked-system" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-disabled>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>System</span>
          </span>
        </span>
      </label>
    </div>
  </div>
</div>
