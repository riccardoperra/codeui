<div style="max-width: 688px; margin-inline: auto">
  <div role="radiogroup" aria-labelledby="frame-label" aria-orientation="horizontal" class="cui-optioncard" data-cui="optioncard">
    <span id="frame-label" class="cui-optioncard-label" data-cui="optioncard-label">Window frame</span>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-checked>
      <input id="frame-window" type="radio" name="frame" value="window" checked class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="frame-window" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-variant="tile" data-checked>
        <span class="cui-optioncard-preview" data-cui="optioncard-preview" aria-hidden="true">
          <svg width="96" height="68" viewBox="0 0 96 68" aria-hidden="true">
            <rect x="8" y="8" width="80" height="52" rx="8" fill="var(--cui-surface-canvas)" />
            <path d="M20 24h56M20 36h32M20 48h44" stroke="var(--cui-text-muted)" stroke-width="4" />
          </svg>
        </span>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Window</span>
            <span class="cui-badge cui-optioncard-badge" data-cui="optioncard-badge" data-size="sm" data-tone="neutral" data-variant="soft">
              <span class="cui-badge-label" data-cui="badge-label">Default</span>
            </span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="frame-orb" type="radio" name="frame" value="orb" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="frame-orb" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-variant="tile">
        <span class="cui-optioncard-preview" data-cui="optioncard-preview" aria-hidden="true">
          <svg width="96" height="68" viewBox="0 0 96 68" aria-hidden="true">
            <circle cx="48" cy="34" r="24" fill="var(--cui-text-muted)" />
            <circle cx="42" cy="28" r="12" fill="var(--cui-surface-canvas)" />
          </svg>
        </span>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Orb</span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item">
      <input id="frame-list" type="radio" name="frame" value="list" class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="frame-list" class="cui-optioncard-item-label" data-cui="optioncard-item-label" data-variant="tile">
        <span class="cui-optioncard-preview" data-cui="optioncard-preview" aria-hidden="true">
          <span style="font-size: var(--cui-font-size-lg)">Aa</span>
        </span>
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Aa list</span>
          </span>
        </span>
      </label>
    </div>
  </div>
</div>
