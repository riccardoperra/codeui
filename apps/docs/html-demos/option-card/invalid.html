<div style="max-width: 688px; margin-inline: auto">
  <div role="radiogroup" aria-labelledby="required-mode-label" aria-orientation="horizontal" aria-describedby="required-mode-error" aria-invalid="true" class="cui-optioncard" data-cui="optioncard">
    <span id="required-mode-label" class="cui-optioncard-label" data-cui="optioncard-label">Colour mode</span>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-invalid>
      <input id="required-mode-dark" type="radio" name="required-mode" value="dark" required class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="required-mode-dark" class="cui-optioncard-item-label" data-cui="optioncard-item-label">
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Dark</span>
          </span>
        </span>
      </label>
    </div>
    <div class="cui-optioncard-item" data-cui="optioncard-item" data-invalid>
      <input id="required-mode-light" type="radio" name="required-mode" value="light" required class="cui-optioncard-item-input" data-cui="optioncard-item-input" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <label for="required-mode-light" class="cui-optioncard-item-label" data-cui="optioncard-item-label">
        <span class="cui-optioncard-item-text">
          <span class="cui-optioncard-item-name">
            <span>Light</span>
          </span>
        </span>
      </label>
    </div>
    <div id="required-mode-error" class="cui-optioncard-error-message" data-cui="optioncard-error-message">Choose a colour mode.</div>
  </div>
</div>
