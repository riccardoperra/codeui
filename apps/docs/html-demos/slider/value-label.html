<div style="max-width: 400px; margin-inline: auto">
  <div class="cui-slider" data-cui="slider" data-orientation="horizontal">
    <label id="opacity-text-label" class="cui-slider-label" data-cui="slider-label">Background opacity</label>
    <div class="cui-slider-value-label" data-cui="slider-value-label">75 percent opacity</div>
    <div class="cui-slider-track" data-cui="slider-track" data-orientation="horizontal">
      <div class="cui-slider-fill" data-cui="slider-fill" data-orientation="horizontal" style="left: 0%; right: 25%"></div>
      <span role="slider" tabindex="0" aria-labelledby="opacity-text-label" aria-valuenow="0.75" aria-valuemin="0" aria-valuemax="1" aria-valuetext="75 percent opacity" aria-orientation="horizontal" class="cui-slider-thumb" data-cui="slider-thumb" style="position: absolute; left: 75%; transform: translateX(-50%)">
        <input type="hidden" name="opacity" value="0.75" class="cui-slider-input" data-cui="slider-input" />
      </span>
    </div>
  </div>
</div>
