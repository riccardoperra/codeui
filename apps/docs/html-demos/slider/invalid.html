<div style="max-width: 400px; margin-inline: auto">
  <div class="cui-slider" data-cui="slider" data-orientation="horizontal">
    <label id="invalid-label" class="cui-slider-label" data-cui="slider-label">Background opacity</label>
    <div class="cui-slider-value-label" data-cui="slider-value-label">75</div>
    <div class="cui-slider-track" data-cui="slider-track" data-orientation="horizontal">
      <div class="cui-slider-fill" data-cui="slider-fill" data-orientation="horizontal" style="left: 0%; right: 25%"></div>
      <span role="slider" tabindex="0" aria-labelledby="invalid-label" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-valuetext="75" aria-orientation="horizontal" aria-describedby="invalid-error" aria-invalid="true" class="cui-slider-thumb" data-cui="slider-thumb" data-invalid style="position: absolute; left: 75%; transform: translateX(-50%)">
        <input type="hidden" name="opacity" value="75" class="cui-slider-input" data-cui="slider-input" />
      </span>
    </div>
    <div id="invalid-error" class="cui-slider-error-message" data-cui="slider-error-message">Choose a background opacity.</div>
  </div>
</div>
