<div class="cui-stack" data-gap="1.5" style="max-width: 280px; margin-inline: auto">
  <div role="group" class="cui-combobox" data-cui="combobox">
    <label for="empty-lang" class="cui-combobox-label" data-cui="combobox-label">Language</label>
    <div class="cui-combobox-control" data-cui="combobox-control" data-size="sm" data-expanded>
      <input id="empty-lang" type="text" role="combobox" value="Haskel" placeholder="Search languages" autocomplete="off" aria-autocomplete="list" aria-expanded="true" aria-controls="empty-lang-listbox" class="cui-combobox-input" data-cui="combobox-input" data-expanded />
      <button type="button" tabindex="-1" aria-label="Show languages" aria-expanded="true" class="cui-combobox-trigger" data-cui="combobox-trigger" data-expanded>
        <span aria-hidden="true" class="cui-combobox-icon" data-cui="combobox-icon">
          <svg class="cui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
          </svg>
        </span>
      </button>
    </div>
  </div>
  <div class="cui-combobox-content" data-cui="combobox-content" data-expanded>
    <ul id="empty-lang-listbox" role="listbox" aria-label="Suggestions" class="cui-combobox-listbox" data-cui="combobox-listbox"></ul>
    <div class="cui-combobox-empty" role="presentation">No language matches "Haskel".</div>
  </div>
</div>
