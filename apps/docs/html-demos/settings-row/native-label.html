<div class="cui-stack" data-gap="6" style="max-width: 600px; margin-inline: auto; padding: 8px 24px 24px; border-radius: var(--cui-radius-card); background: var(--cui-surface-panel)">
  <section class="cui-settings-group" data-cui="settings-group" aria-labelledby="export-name-title">
    <h3 id="export-name-title" class="cui-settings-group-title" data-cui="settings-group-title">Export</h3>
    <div class="cui-settings-group-content" data-cui="settings-group-content">
      <div class="cui-settings-row" data-cui="settings-row" data-compact-control role="group" aria-labelledby="file-name-label" aria-describedby="file-name-desc">
        <label id="file-name-label" for="file-name" class="cui-settings-row-label" data-cui="settings-row-label">File name</label>
        <div id="file-name-desc" class="cui-settings-row-description" data-cui="settings-row-description">Used when you save the image.</div>
        <div class="cui-settings-row-control" data-cui="settings-row-control">
          <div class="cui-textfield cui-field" data-cui="textfield" data-field-size="sm" role="group">
            <input id="file-name" type="text" value="snippet.png" aria-describedby="file-name-desc" class="cui-field-input cui-textfield-input" data-cui="textfield-input" data-size="sm" data-variant="filled" />
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
