<div class="cui-stack" data-gap="6" style="max-width: 600px; margin-inline: auto; padding: 8px 24px 24px; border-radius: var(--cui-radius-card); background: var(--cui-surface-panel)">
  <section class="cui-settings-group" data-cui="settings-group" aria-labelledby="colours-title">
    <h3 id="colours-title" class="cui-settings-group-title" data-cui="settings-group-title">Colours</h3>
    <div class="cui-settings-group-content" data-cui="settings-group-content">
      <div class="cui-settings-row" data-cui="settings-row" data-layout="wide" role="group" aria-labelledby="colour-mode-label" aria-describedby="colour-mode-desc">
        <span id="colour-mode-label" class="cui-settings-row-label" data-cui="settings-row-label">Colour mode</span>
        <div id="colour-mode-desc" class="cui-settings-row-description" data-cui="settings-row-description">Dark, light, or the same as your system.</div>
        <div class="cui-settings-row-control" data-cui="settings-row-control">
          <div class="cui-segmentedcontrol" data-cui="segmentedcontrol" data-size="sm" data-variant="solid" data-fluid>
            <div role="tablist" aria-labelledby="colour-mode-label" aria-describedby="colour-mode-desc" aria-orientation="horizontal" class="cui-segmentedcontrol-list" data-cui="segmentedcontrol-list">
              <button type="button" role="tab" aria-selected="true" tabindex="0" data-selected class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Dark</button>
              <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">Light</button>
              <button type="button" role="tab" aria-selected="false" tabindex="-1" class="cui-segmentedcontrol-segment" data-cui="segmentedcontrol-item">System</button>
              <div role="presentation" class="cui-segmentedcontrol-indicator" data-cui="segmentedcontrol-indicator" style="left: 0; width: calc((100% - 2 * var(--cui-space-1)) / 3)"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
