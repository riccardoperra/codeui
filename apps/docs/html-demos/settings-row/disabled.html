<div class="cui-stack" data-gap="6" style="max-width: 600px; margin-inline: auto; padding: 8px 24px 24px; border-radius: var(--cui-radius-card); background: var(--cui-surface-panel)">
  <section class="cui-settings-group" data-cui="settings-group" aria-labelledby="export-title">
    <h3 id="export-title" class="cui-settings-group-title" data-cui="settings-group-title">Export</h3>
    <div class="cui-settings-group-content" data-cui="settings-group-content">
      <div class="cui-settings-row" data-cui="settings-row" data-compact-control role="group" aria-labelledby="transparent-label" aria-describedby="transparent-desc">
        <span id="transparent-label" class="cui-settings-row-label" data-cui="settings-row-label">Transparent background</span>
        <div id="transparent-desc" class="cui-settings-row-description" data-cui="settings-row-description">Not available for JPEG.</div>
        <div class="cui-settings-row-control" data-cui="settings-row-control">
          <div class="cui-switch" data-cui="switch" data-size="md" data-disabled>
            <input id="transparent" type="checkbox" role="switch" disabled aria-labelledby="transparent-label" aria-describedby="transparent-desc" class="cui-switch-input" data-cui="switch-input" data-size="md" data-disabled style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
            <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-disabled aria-hidden="true">
              <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md" data-disabled></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
