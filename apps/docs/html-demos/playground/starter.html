<form class="cui-stack" data-gap="4" style="max-width: 360px; margin-inline: auto">
  <div class="cui-stack" data-gap="1">
    <h2 class="cui-text" data-size="lg" data-weight="semibold" style="margin: 0">Export snippet</h2>
    <p class="cui-text" data-tone="muted" style="margin: 0">This form is plain HTML and one stylesheet.</p>
  </div>

  <div role="group" class="cui-textfield cui-field" data-cui="textfield" data-field-size="sm">
    <label for="file-name" class="cui-field-label" data-cui="textfield-label">File name</label>
    <input id="file-name" type="text" value="my-snippet" class="cui-field-input cui-textfield-input" data-cui="textfield-input" data-size="sm" data-variant="filled" />
    <div class="cui-field-description" data-cui="textfield-description">Used as the name of the PNG.</div>
  </div>

  <div class="cui-stack" data-direction="row" data-gap="2" data-justify="end">
    <button type="button" class="cui-button" data-cui="button" data-variant="secondary">Cancel</button>
    <button type="submit" class="cui-button" data-cui="button" data-variant="primary">Export PNG</button>
  </div>
</form>
