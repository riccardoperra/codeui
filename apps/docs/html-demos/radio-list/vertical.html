<div class="cui-textfield cui-field" data-cui="radiolist" data-field-size="md" role="radiogroup" aria-labelledby="vertical-label" aria-orientation="vertical">
  <span id="vertical-label" class="cui-field-label" data-cui="radiolist-label">Export format</span>
  <div class="cui-radiolist" data-cui="radiolist-items" data-size="md" data-orientation="vertical">
    <div class="cui-radiolist-item" data-cui="radiolist-item">
      <input id="vertical-png" type="radio" name="vertical" value="png" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
      <label for="vertical-png" data-cui="radiolist-item-label">PNG</label>
    </div>
    <div class="cui-radiolist-item" data-cui="radiolist-item" data-checked>
      <input id="vertical-svg" type="radio" name="vertical" value="svg" checked style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" data-checked aria-hidden="true">
        <div class="cui-radiolist-indicator" data-cui="radiolist-item-indicator"></div>
      </div>
      <label for="vertical-svg" data-cui="radiolist-item-label">SVG</label>
    </div>
    <div class="cui-radiolist-item" data-cui="radiolist-item">
      <input id="vertical-jpeg" type="radio" name="vertical" value="jpeg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
      <label for="vertical-jpeg" data-cui="radiolist-item-label">JPEG</label>
    </div>
  </div>
</div>
