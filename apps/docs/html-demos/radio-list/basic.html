<div class="cui-textfield cui-field" data-cui="radiolist" data-field-size="md" role="radiogroup" aria-labelledby="format-label" aria-orientation="horizontal" aria-describedby="format-hint">
  <span id="format-label" class="cui-field-label" data-cui="radiolist-label">Export format</span>
  <div class="cui-radiolist" data-cui="radiolist-items" data-size="md" data-orientation="horizontal">
    <div class="cui-radiolist-item" data-cui="radiolist-item" data-checked>
      <input id="format-png" type="radio" name="format" value="png" checked style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" data-checked aria-hidden="true">
        <div class="cui-radiolist-indicator" data-cui="radiolist-item-indicator"></div>
      </div>
      <label for="format-png" data-cui="radiolist-item-label">PNG</label>
    </div>
    <div class="cui-radiolist-item" data-cui="radiolist-item">
      <input id="format-svg" type="radio" name="format" value="svg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
      <label for="format-svg" data-cui="radiolist-item-label">SVG</label>
    </div>
    <div class="cui-radiolist-item" data-cui="radiolist-item">
      <input id="format-jpeg" type="radio" name="format" value="jpeg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
      <label for="format-jpeg" data-cui="radiolist-item-label">JPEG</label>
    </div>
  </div>
  <div id="format-hint" class="cui-field-description" data-cui="radiolist-description">Choose the exported image format.</div>
</div>
