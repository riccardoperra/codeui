<div class="cui-stack" data-gap="6">
  <div class="cui-textfield cui-field" data-cui="radiolist" data-field-size="md" role="radiogroup" aria-labelledby="theme-default-label" aria-orientation="horizontal">
    <span id="theme-default-label" class="cui-field-label" data-cui="radiolist-label">Outline</span>
    <div class="cui-radiolist" data-cui="radiolist-items" data-size="md" data-orientation="horizontal">
      <div class="cui-radiolist-item" data-cui="radiolist-item" data-checked>
        <input id="theme-default-png" type="radio" name="theme-default" value="png" checked style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
        <div class="cui-radiolist-radio" data-cui="radiolist-item-control" data-checked aria-hidden="true">
          <div class="cui-radiolist-indicator" data-cui="radiolist-item-indicator"></div>
        </div>
        <label for="theme-default-png" data-cui="radiolist-item-label">PNG</label>
      </div>
      <div class="cui-radiolist-item" data-cui="radiolist-item">
        <input id="theme-default-svg" type="radio" name="theme-default" value="svg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
        <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
        <label for="theme-default-svg" data-cui="radiolist-item-label">SVG</label>
      </div>
      <div class="cui-radiolist-item" data-cui="radiolist-item">
        <input id="theme-default-jpeg" type="radio" name="theme-default" value="jpeg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
        <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
        <label for="theme-default-jpeg" data-cui="radiolist-item-label">JPEG</label>
      </div>
    </div>
  </div>
  <div class="cui-textfield cui-field" data-cui="radiolist" data-field-size="md" role="radiogroup" aria-labelledby="theme-filled-label" aria-orientation="horizontal">
    <span id="theme-filled-label" class="cui-field-label" data-cui="radiolist-label">Filled</span>
    <div class="cui-radiolist" data-cui="radiolist-items" data-size="md" data-orientation="horizontal" data-variant="filled">
      <div class="cui-radiolist-item" data-cui="radiolist-item" data-checked>
        <input id="theme-filled-png" type="radio" name="theme-filled" value="png" checked style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
        <div class="cui-radiolist-radio" data-cui="radiolist-item-control" data-checked aria-hidden="true">
          <div class="cui-radiolist-indicator" data-cui="radiolist-item-indicator"></div>
        </div>
        <label for="theme-filled-png" data-cui="radiolist-item-label">PNG</label>
      </div>
      <div class="cui-radiolist-item" data-cui="radiolist-item">
        <input id="theme-filled-svg" type="radio" name="theme-filled" value="svg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
        <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
        <label for="theme-filled-svg" data-cui="radiolist-item-label">SVG</label>
      </div>
      <div class="cui-radiolist-item" data-cui="radiolist-item">
        <input id="theme-filled-jpeg" type="radio" name="theme-filled" value="jpeg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
        <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
        <label for="theme-filled-jpeg" data-cui="radiolist-item-label">JPEG</label>
      </div>
    </div>
  </div>
</div>
