<div class="cui-textfield cui-field" data-cui="radiolist" data-field-size="md" role="radiogroup" aria-labelledby="invalid-label" aria-orientation="horizontal" aria-describedby="invalid-error" aria-invalid="true">
  <span id="invalid-label" class="cui-field-label" data-cui="radiolist-label">Export format</span>
  <div class="cui-radiolist" data-cui="radiolist-items" data-size="md" data-orientation="horizontal">
    <div class="cui-radiolist-item" data-cui="radiolist-item">
      <input id="invalid-png" type="radio" name="invalid" value="png" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
      <label for="invalid-png" data-cui="radiolist-item-label">PNG</label>
    </div>
    <div class="cui-radiolist-item" data-cui="radiolist-item" data-checked>
      <input id="invalid-svg" type="radio" name="invalid" value="svg" checked style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" data-checked data-invalid aria-hidden="true">
        <div class="cui-radiolist-indicator" data-cui="radiolist-item-indicator"></div>
      </div>
      <label for="invalid-svg" data-cui="radiolist-item-label">SVG</label>
    </div>
    <div class="cui-radiolist-item" data-cui="radiolist-item">
      <input id="invalid-jpeg" type="radio" name="invalid" value="jpeg" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
      <div class="cui-radiolist-radio" data-cui="radiolist-item-control" aria-hidden="true"></div>
      <label for="invalid-jpeg" data-cui="radiolist-item-label">JPEG</label>
    </div>
  </div>
  <div id="invalid-error" class="cui-field-error" data-cui="radiolist-error-message">SVG export does not support this theme.</div>
</div>
