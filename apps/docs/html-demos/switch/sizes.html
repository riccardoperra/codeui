<div class="cui-stack" data-gap="4" data-align="start">
  <div class="cui-switch" data-cui="switch" data-size="sm" data-checked>
    <input id="size-sm" type="checkbox" role="switch" checked class="cui-switch-input" data-cui="switch-input" data-size="sm" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
    <div class="cui-switch-control" data-cui="switch-control" data-size="sm" data-checked aria-hidden="true">
      <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="sm" data-checked></div>
    </div>
    <label for="size-sm" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="sm">Line numbers (sm)</label>
  </div>
  <div class="cui-switch" data-cui="switch" data-size="md" data-checked>
    <input id="size-md" type="checkbox" role="switch" checked class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
    <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-checked aria-hidden="true">
      <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md" data-checked></div>
    </div>
    <label for="size-md" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Line numbers (md)</label>
  </div>
</div>
