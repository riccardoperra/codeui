<div class="cui-switch" data-cui="switch" data-size="md" data-checked>
  <input id="line-numbers" type="checkbox" role="switch" checked aria-describedby="line-numbers-hint" class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
  <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-checked aria-hidden="true">
    <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md" data-checked></div>

  <label for="line-numbers" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Show line numbers</label>

</div>
