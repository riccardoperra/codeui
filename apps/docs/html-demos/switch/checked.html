<div class="cui-stack" data-gap="4" data-align="start">
  <div class="cui-switch" data-cui="switch" data-size="md">
    <input id="state-off" type="checkbox" role="switch" class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
    <div class="cui-switch-control" data-cui="switch-control" data-size="md" aria-hidden="true">
      <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md"></div>
    </div>
    <label for="state-off" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Show window header</label>
  </div>
  <div class="cui-switch" data-cui="switch" data-size="md" data-checked>
    <input id="state-on" type="checkbox" role="switch" checked class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
    <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-checked aria-hidden="true">
      <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md" data-checked></div>
    </div>
    <label for="state-on" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Show line numbers</label>
  </div>
</div>
