<div class="cui-switch" data-cui="switch" data-size="md" data-checked>
  <input id="invalid" type="checkbox" role="switch" checked aria-invalid="true" aria-describedby="invalid-hint invalid-error" class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
  <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-checked data-invalid aria-hidden="true">
    <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md" data-checked></div>
  </div>
  <label for="invalid" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Show line numbers</label>
  <div id="invalid-hint" class="cui-switch-description" data-cui="switch-description" data-size="md">Include line numbers in the export.</div>
  <div id="invalid-error" class="cui-switch-error-message" data-cui="switch-error-message" data-size="md">Enable line numbers before you export.</div>
</div>
