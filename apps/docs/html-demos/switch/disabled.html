<div class="cui-stack" data-gap="4" data-align="start">
  <div class="cui-switch" data-cui="switch" data-size="md" data-checked data-disabled>
    <input id="disabled-on" type="checkbox" role="switch" checked disabled aria-describedby="disabled-on-hint" class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
    <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-checked data-disabled aria-hidden="true">
      <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md" data-checked></div>
    </div>
    <label for="disabled-on" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Show line numbers</label>
    <div id="disabled-on-hint" class="cui-switch-description" data-cui="switch-description" data-size="md">Include line numbers in the export.</div>
  </div>
  <div class="cui-switch" data-cui="switch" data-size="md" data-disabled>
    <input id="disabled-off" type="checkbox" role="switch" disabled class="cui-switch-input" data-cui="switch-input" data-size="md" style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap" />
    <div class="cui-switch-control" data-cui="switch-control" data-size="md" data-disabled aria-hidden="true">
      <div class="cui-switch-thumb" data-cui="switch-thumb" data-size="md"></div>
    </div>
    <label for="disabled-off" class="cui-switch-label cui-field-label" data-cui="switch-label" data-size="md">Show window header</label>
  </div>
</div>
