name: Package preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:kit

      - name: Pack the preview packages
        run: pnpm --filter '@codeui/kit...' pack --recursive --pack-destination "$RUNNER_TEMP/codeui-preview"

      - name: Upload installable packages
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeui-preview
          path: ${{ runner.temp }}/codeui-preview/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish package preview URLs
        id: publish
        # The GitHub artifact can still be installed if pkg.pr.new is unavailable.
        continue-on-error: true
        run: >-
          pnpm exec pkg-pr-new publish --pnpm --no-compact --no-template
          --previewVersion --comment=off --json "$RUNNER_TEMP/codeui-preview.json"
          ./packages/inkstone ./packages/styles ./packages/kit

      - name: Comment the preview links
        if: steps.publish.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { join } = require('node:path');
            const { packages } = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'codeui-preview.json'), 'utf8'));
            const kit = packages.find(pkg => pkg.name === '@codeui/kit');
            const marker = '<!-- codeui-package-preview -->';
            const body = [
              marker,
              '### CodeUI package preview',
              '',
              `Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`,
              '',
              '\`\`\`sh',
              `npm install ${kit.url}`,
              '\`\`\`',
              '',
              'The kit installs matching previews of \`@codeui/styles\` and \`@codeui/inkstone\`.',
              '',
              ...packages.map(pkg => `- [${pkg.name}](${pkg.url})`),
            ].join('\n');
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

      - name: Show download instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "### CodeUI preview packages"
            if [ "$PUBLISH_OUTCOME" != success ]; then
              echo "pkg.pr.new could not publish preview URLs. Check the publish step for details."
              echo
            fi
            echo "[Download the three package tarballs]($ARTIFACT_URL)"
            echo
            echo '```sh'
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY -n codeui-preview -D .codeui-preview"
            echo 'npm install ./.codeui-preview/*.tgz'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
