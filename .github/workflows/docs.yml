name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'apps/examples/**'
      - 'tools/docs/**'
      - 'tools/palette/**'
      - 'packages/kit/**'
      - 'packages/docs-demos/**'
      - 'packages/styles/**'
      - 'packages/inkstone/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'apps/examples/**'
      - 'tools/docs/**'
      - 'tools/palette/**'
      - 'packages/kit/**'
      - 'packages/docs-demos/**'
      - 'packages/styles/**'
      - 'packages/inkstone/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  CLOUDFLARE_PROJECT_NAME: codeui-docs

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Pull requests from forks have no access to the Cloudflare secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'docs-production' || 'docs-preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo run build --filter=@codeui/docs...
        env:
          CI: true
          NITRO_PRESET: cloudflare-pages

      # After the build: the anatomy check renders the built demos.
      - name: Lint docs content
        run: pnpm docs:lint

      - name: Create the Pages project if missing
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler pages project list --json | grep -q "\"${CLOUDFLARE_PROJECT_NAME}\""; then
            echo "Pages project ${CLOUDFLARE_PROJECT_NAME} exists."
          else
            pnpm exec wrangler pages project create "${CLOUDFLARE_PROJECT_NAME}" --production-branch=main
          fi

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/docs
          # Pushes to main go to production. Other branches get a preview URL.
          command: >-
            pages deploy dist
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- codeui-docs-preview -->';
            const body = [
              marker,
              '**Docs preview** deployed to Cloudflare Pages.',
              '',
              `- Commit: ${process.env.DEPLOYMENT_URL}`,
              process.env.ALIAS_URL ? `- Branch: ${process.env.ALIAS_URL}` : '',
              '',
              `Built from ${context.payload.pull_request.head.sha}.`,
            ].filter((line) => line !== null).join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
