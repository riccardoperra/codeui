name: Build and Test

on: [ push ]

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.19.0 ]
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm turbo run build --filter=!@codeui/docs

        env:
          CI: true

      - name: Test
        run: pnpm test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Check public API
        if: ${{ !cancelled() }}
        run: pnpm api:check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # TanStack Start and Nitro need Node 22.
          node-version: 22.22.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        run: pnpm turbo run build --filter=@codeui/docs...
        env:
          CI: true
