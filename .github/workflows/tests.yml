name: Build and Test

on: [ push ]

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24.x ]
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm turbo run build --filter=!@codeui/docs

        env:
          CI: true

      - name: Test
        run: pnpm test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Check public API
        if: ${{ !cancelled() }}
        run: pnpm api:check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        run: pnpm turbo run build --filter=@codeui/docs...
        env:
          CI: true

      - name: Check docs export coverage
        run: node tools/docs/coverage.mjs

      - name: Check docs Markdown routes
        run: |
          PORT=6150 node apps/docs/.output/server/index.mjs &
          npx --yes wait-on@8.0.3 --timeout 30000 http://localhost:6150/llms.txt
          node tools/docs/check-llms.mjs http://localhost:6150
