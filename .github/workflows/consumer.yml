name: Packed kit consumer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/consumer.yml"
      - "examples/check-hydration.mjs"
      - "examples/consumer-*/**"
      - "examples/run-consumer-check.mjs"
      - "packages/inkstone/**"
      - "packages/kit/**"
      - "packages/styles/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install-deps chromium
      - run: node examples/run-consumer-check.mjs
